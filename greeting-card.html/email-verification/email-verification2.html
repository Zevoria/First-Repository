<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<!-- Makes the page work well on phones and computers -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Email Verification</title>

	<!-- Connect CSS file -->
	<link rel="stylesheet" href="email-verification.css">
</head>

<body>

	<div class="container">

		<h1>Email Verification</h1>

		<p>Enter your email address below.</p>

		<!-- Email input -->
		<input
			type="text"
			id="emailInput"
			placeholder="example@email.com"
		>

		<!-- Button -->
		<button id="verifyButton">Verify Email</button>

		<!-- JavaScript will put the result here -->
		<p id="message"></p>

	</div>

	<!-- Connect our JavaScript file -->
	<script src="email-verification.js"></script>

</body>
</html>
